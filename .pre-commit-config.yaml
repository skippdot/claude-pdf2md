# Run all checks without installing the git hook:
#     source .venv/bin/activate
#     pre-commit run --all-files
#
# Wire it into git only if you want it to fire on every commit:
#     pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Run ruff format (check mode)
        entry: ruff format --check --diff
        language: system
        types: [python]
        files: '^(claude_pdf2md|tests)/.*\.py$'
      - id: ruff-check
        name: Run ruff check (lint)
        entry: ruff check
        language: system
        types: [python]
        files: '^claude_pdf2md/.*\.py$'
      - id: bandit
        name: Run bandit (security, -ll)
        entry: bandit -r claude_pdf2md -ll
        language: system
        pass_filenames: false
        always_run: false
        files: '^claude_pdf2md/.*\.py$'
      - id: pytest
        name: Run pytest with coverage (fail under 85)
        entry: pytest --cov=claude_pdf2md --cov-fail-under=85 -q
        language: system
        pass_filenames: false
        always_run: false
        files: '.*\.py$'
