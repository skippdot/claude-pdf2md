[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "claude-pdf2md"
version = "0.1.0"
description = "Convert PDFs (especially Claude Web UI research exports) to Markdown with hyperlinks and visual structure preserved."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "skippdot", email = "skippdot@gmail.com" }]
keywords = ["pdf", "markdown", "claude", "research", "hyperlinks", "conversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Office/Business",
]
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
diff = [
    "markdown-it-py>=3.0",
    "weasyprint>=60",
]
dev = [
    "pytest>=7.4",
    "claude-pdf2md[diff]",
]

[project.scripts]
claude-pdf2md = "claude_pdf2md.cli:main"

[project.urls]
Homepage = "https://github.com/skippdot/claude-pdf2md"
Issues = "https://github.com/skippdot/claude-pdf2md/issues"

[tool.hatch.build.targets.wheel]
packages = ["claude_pdf2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "roundtrip: MD→PDF→MD fidelity tests (require WeasyPrint).",
]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
