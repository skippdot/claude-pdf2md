[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "claude-pdf2md"
dynamic = ["version"]
description = "Convert PDFs (especially Claude Web UI research exports) to Markdown with hyperlinks and visual structure preserved."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "skippdot", email = "skippdot@gmail.com" }]
keywords = ["pdf", "markdown", "claude", "research", "hyperlinks", "conversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Office/Business",
]
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
diff = [
    "markdown-it-py>=3.0",
    "weasyprint>=60",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit>=1.7",
    "pre-commit>=3.7",
    "claude-pdf2md[diff]",
]

[project.scripts]
claude-pdf2md = "claude_pdf2md.cli:main"

[tool.claude-pdf2md.release]
# Usage:
#   python scripts/bump_version.py patch --commit   # 0.1.0 -> 0.1.1 + tag
#   python scripts/bump_version.py minor --commit   # 0.1.0 -> 0.2.0 + tag
#   python scripts/bump_version.py major --commit   # 0.1.0 -> 1.0.0 + tag
#   python scripts/bump_version.py set 1.2.3        # pin explicit
#   python scripts/bump_version.py show             # print current

[project.urls]
Homepage = "https://github.com/skippdot/claude-pdf2md"
Issues = "https://github.com/skippdot/claude-pdf2md/issues"

[tool.hatch.version]
path = "claude_pdf2md/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["claude_pdf2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "roundtrip: MD→PDF→MD fidelity tests (require WeasyPrint).",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes baseline.
# I: import sorting (isort).
# B: flake8-bugbear (real bug patterns).
# UP: pyupgrade (idiomatic modern Python).
# PL: pylint-ported rules (covers what .pylintrc used to enforce).
# RUF: ruff-native rules.
# Note: `S` (bandit-port) is intentionally NOT selected — bandit runs as its
# own CI job and owns security scanning end-to-end.
# Note: `D` (pydocstyle) is NOT selected — project style keeps docstrings sparse.
select = ["E", "F", "W", "I", "B", "UP", "PL", "RUF"]
ignore = [
    "PLC0415", # import-outside-toplevel — weasyprint/markdown_it are lazy-loaded from the [diff] extra.
    "PLR0911", # too-many-return-statements — dense state machines in structure.py / emit.py.
    "PLR0914", # too-many-locals — same.
    "PLR0916", # too-many-boolean-expressions — classification predicates in emit.py.
    "PLR2004", # magic-value-comparison — numeric layout thresholds (pt, ratios) are clearer inline.
    "RUF001", # ambiguous unicode — bullet/dash regex character classes intentionally include en-dash.
]
# Note: ruff does not implement PLR0902 (too-many-instance-attributes), so the
# `Block` dataclass's 9 fields don't need a threshold override the way pylint did.

[tool.coverage.run]
source = ["claude_pdf2md"]
branch = true
omit = ["claude_pdf2md/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
